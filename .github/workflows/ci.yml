name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # node:sqlite requires Node 22.5+; keep in sync with package.json engines.
        node-version: 22
        cache: 'npm'
      
    - name: Install dependencies
      run: npm ci

    - name: Clearing previous builds
      run: npm run clean
      
    - name: Run Linter
      run: npm run lint

    - name: Type Check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run Tests
      run: npm test

    - name: Electron E2E smoke test (Windows / macOS)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      run: npm run test:e2e

    - name: Electron E2E smoke test (Linux, virtual display)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum npm run test:e2e

    - name: Package Windows application
      if: runner.os == 'Windows'
      run: npm run package-win

    - name: Package macOS application
      if: runner.os == 'macOS'
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: npm run package-mac -- --config.mac.identity=null --config.mac.notarize=false

    - name: Upload installer
      if: runner.os == 'Windows' || runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ runner.os }}
        path: release/**
